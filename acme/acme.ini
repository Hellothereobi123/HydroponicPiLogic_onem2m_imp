;
;	ACME CSE configuration for a HydroPi (oneM2M proof of concept).
;
;	The Pi runs this CSE and is also the AE that registers with it (pi/onem2m/). Only settings
;	that differ from ACME's defaults (acmecse/init/acme.ini.default) are listed here.
;	Run with:  acmecse --config acme.ini --base-directory <this directory> --headless
;	See docs/onem2m.md for setup. Tested with ACME 2026.5.3.
;
;	Secrets are NOT in this file: ACME reads acme/.env (gitignored) from its base directory.
;	It must define ACME_SECURITY_SECRET; startup fails without it.
;

[basic.config]
; MN-CSE now, so that later it can register to the IN-CSE on EC2 without changing its type,
; IDs or resource names. Until then it runs on its own (checked: requests are served normally).
cseType=MN
; CSE-ID and CSEBase name. With one Pi this is fine; before several Pis register to the same
; IN-CSE, give each a unique pair (e.g. id-hydropi-3f9a0c12 / cse-hydropi-3f9a0c12) and set the
; same name as ONEM2M_CSE_RN in pi/.env and the app.
cseID=id-hydropi
cseName=cse-hydropi
serviceProviderID=//hydroos.local
adminID=CAdmin
httpPort=8080
; Address the CSE advertises for itself (point-of-access). Clients connect to the Pi's LAN
; address regardless; this only matters for notifications, which this setup doesn't use.
cseHost=127.0.0.1
networkInterface=0.0.0.0
databaseType=tinydb
logLevel=info
; Used to hash the bearer tokens in certs/http_token_auth.txt (pi/onem2m/make_token.py)
secret=${ACME_SECURITY_SECRET}
; Registrar (IN-CSE). Not used until EC2 exists; remote CSE support is off below.
registrarCseHost=127.0.0.1
registrarCsePort=8080
registrarCseID=id-in
registrarCseName=cse-in

[cse]
; No registrar yet. Set to true (and fill in the registrar above) when the EC2 IN-CSE exists.
enableRemoteCSE=false

[cse.registration]
; Only HydroPi AEs may register. The app reads without registering.
; CAdmin (adminID above) must stay in the list: once enableRemoteCSE=true, ACME's own startup
; script runs as CAdmin and startup fails with "Originator not allowed" if it's missing
; (checked with ACME 2026.5.3). It's harmless while remote CSE support is off.
allowedAEOriginators=CHydroPi-*,CAdmin

[database.tinydb]
; TinyDB rewrites its file on each write. Batch writes for 30 s to spare the SD card; at most
; that much CSE data is lost in a crash, and the Pi's SQLite database still has every reading.
writeDelay=30

[http.security]
; Every request needs "Authorization: Bearer <token>"; the file holds HMACs of the tokens.
enableTokenAuth=true
tokenAuthFile=${basic.config:baseDirectory}/certs/http_token_auth.txt

[http.cors]
; Lets the app's web build (browser) call the CSE during development. The Android app doesn't
; need it.
enable=true
